name: Aggiorna meteo

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meteo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow
        run: pip install pillow

      - name: Genera l'immagine
        run: python kindle_meteo.py

      - name: Salva weather.png nel repository
        run: |
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add weather.png
          git commit -m "Aggiorna meteo" || exit 0
          git push
